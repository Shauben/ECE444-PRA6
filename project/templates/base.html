<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flaskr-TDD</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  </head>
  <body>
    <main class="container py-4" style="max-width: 850px">
      <h1>Flaskr-TDD</h1>
      <nav class="d-flex gap-2 my-3">
        <a class="btn btn-outline-primary" href="{{ url_for('index') }}">Home</a>
        <a class="btn btn-info" href="{{ url_for('search') }}">Search</a>
        {% if session.get('logged_in') %}
          <a class="btn btn-warning" href="{{ url_for('logout') }}">log out</a>
        {% else %}
          <a class="btn btn-success" href="{{ url_for('login') }}">log in</a>
        {% endif %}
      </nav>
      {% for message in get_flashed_messages() %}
        <div class="flash alert alert-info">{{ message }}</div>
      {% endfor %}
      {% block body %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='main.js') }}" defer></script>
  </body>
</html>
